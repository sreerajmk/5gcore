apiVersion: v1
kind: Service
metadata:
  name: ausf
  labels:
    app: ausf
spec:
  selector:
    app: ausf
  ports:
    - name: http
      port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ausf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ausf
  template:
    metadata:
      labels:
        app: ausf
    spec:
      containers:
        - name: ausf
          image: 5gcore:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/5gcore-ausf"]
          env:
            - name: NRF_URL
              value: "http://nrf:8000"
            - name: NF_HOST
              value: "ausf"
            - name: NF_PORT
              value: "8003"
          ports:
            - containerPort: 8003
